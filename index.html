<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Knowledge Base - Pro Cloud V4</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --carrefour-blue: #005bbb;
            --carrefour-dark-blue: #00387b;
            --bg-light: #f4f7f9;
            --card-light: #ffffff;
            --text-light: #333;
            --border-light: #dee2e6;
        }
        body.dark-mode {
            --bg-light: #121212; --card-light: #1e1e1e; --text-light: #e0e0e0; --border-light: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light); margin: 0; color: var(--text-light); transition: 0.3s; }
        header { background: var(--carrefour-dark-blue); color: white; padding: 12px 40px; display: flex; justify-content: space-between; align-items: center; }
        
        /* LOGIN */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--carrefour-dark-blue); position: fixed; width: 100%; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 320px; text-align: center; color: #333; }
        
        #app-screen { display: none; }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 350px 1fr; gap: 25px; }
        .container.full { grid-template-columns: 1fr; }

        /* SIDEBAR */
        .sidebar { background: var(--card-light); padding: 25px; border-radius: 12px; border: 1px solid var(--border-light); height: fit-content; position: sticky; top: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-light); border-radius: 8px; background: var(--card-light); color: var(--text-light); }
        
        .btn-save { background: var(--carrefour-blue); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .upload-container { border: 2px dashed var(--carrefour-blue); padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; position: relative; background: rgba(0,91,187,0.03); }
        .upload-container input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .upload-progress { height: 6px; background: #28a745; width: 0%; border-radius: 3px; transition: 0.4s; }

        /* CARDS */
        .kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .kb-card { background: var(--card-light); padding: 20px; border-radius: 12px; border: 1px solid var(--border-light); cursor: pointer; transition: 0.3s; }
        .kb-card:hover { transform: translateY(-5px); border-color: var(--carrefour-blue); }
        .menu-tag { font-size: 10px; background: #e9ecef; padding: 4px 8px; border-radius: 5px; font-weight: bold; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        
        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-light); width: 90%; max-width: 900px; padding: 40px; border-radius: 15px; position: relative; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>NOC Knowledge Base</h2>
            <input type="text" id="u" placeholder="Usuário (Admin)">
            <input type="password" id="p" placeholder="Senha">
            <button onclick="checkLogin()" class="btn-save">ENTRAR</button>
            <p style="font-size: 11px; margin-top: 15px; color: #666;">Admin: NOC / evolve | Leitor: senha leitura123</p>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <h2>KNOWLEDGE BASE | NOC</h2>
            <div>
                <button onclick="logout()" style="color:white; background:transparent; border:1px solid white; padding:5px 10px; cursor:pointer;">Sair</button>
            </div>
        </header>

        <div class="container" id="main-container">
            <aside class="sidebar" id="sidebar-admin">
                <h3>Novo Registro</h3>
                <input type="hidden" id="edit-id">
                <select id="vert">
                    <option value="Operação DVA">Operação DVA</option>
                    <option value="Matriz de Acessos">Matriz de Acessos</option>
                    <option value="Lojas">Lojas</option>
                </select>
                <input type="text" id="tit" placeholder="Título">
                <select id="typ" onchange="toggleUploadUI()">
                    <option value="Texto">Texto</option>
                    <option value="Arquivo">Arquivo (Upload)</option>
                </select>
                <div id="upload-section" style="display:none">
                    <div class="upload-container">
                        <span id="upload-status">📁 Anexar PDF</span>
                        <input type="file" id="file-input" onchange="handleFileUpload()">
                        <div class="upload-progress" id="upload-progress"></div>
                    </div>
                </div>
                <textarea id="cont" rows="5" placeholder="Conteúdo"></textarea>
                <button onclick="saveData()" class="btn-save" id="btn-save">SALVAR</button>
            </aside>

            <main>
                <input type="text" id="search" placeholder="🔍 Buscar..." oninput="handleSearch()" style="width:100%; padding:15px; margin-bottom:20px; border-radius:10px; border:2px solid var(--carrefour-blue);">
                <div class="kb-grid" id="grid"></div>
            </main>
        </div>
    </div>

    <div id="modal" class="modal" onclick="closeM()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="m-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mttpkrnkhqzvnphqsrbn.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10dHBrcm5raHF6dm5waHFzcmJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODcxOTYsImV4cCI6MjA5NDE2MzE5Nn0.7g_10vmDK2cHsPJyN64CNiIxVZxJIBKIXBTKmGYY-Ig';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let db = [];
        let role = sessionStorage.getItem('auth');

        function checkLogin() {
            const u = document.getElementById('u').value.toUpperCase();
            const p = document.getElementById('p').value;
            if (u === 'NOC' && p === 'evolve') sessionStorage.setItem('auth', 'admin');
            else if (p === 'leitura123') sessionStorage.setItem('auth', 'reader');
            else return alert('Acesso negado');
            location.reload();
        }

        if (role) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            if (role === 'reader') {
                document.getElementById('sidebar-admin').style.display = 'none';
                document.getElementById('main-container').classList.add('full');
            }
            carregarDados();
        }

        async function carregarDados() {
            const { data } = await supabaseClient.from('registros').select('*').order('created_at', { ascending: false });
            db = data; render();
        }

        function toggleUploadUI() {
            document.getElementById('upload-section').style.display = (document.getElementById('typ').value === 'Arquivo') ? 'block' : 'none';
        }

        async function handleFileUpload() {
            const file = document.getElementById('file-input').files[0];
            const prog = document.getElementById('upload-progress');
            if (!file) return;
            prog.style.width = '50%';
            const name = `${Date.now()}_${file.name}`;
            const { error } = await supabaseClient.storage.from('arquivos').upload(name, file);
            if (error) return alert('Erro no bucket: verifique as políticas de storage.');
            const { data } = supabaseClient.storage.from('arquivos').getPublicUrl(name);
            document.getElementById('cont').value = data.publicUrl;
            prog.style.width = '100%';
            document.getElementById('upload-status').innerText = '✅ Pronto';
        }

        async function saveData() {
            const payload = { menu: document.getElementById('vert').value, title: document.getElementById('tit').value, type: document.getElementById('typ').value, content: document.getElementById('cont').value };
            const id = document.getElementById('edit-id').value;
            if (id) await supabaseClient.from('registros').update(payload).eq('id', id);
            else await supabaseClient.from('registros').insert([payload]);
            location.reload();
        }

        function render() {
            const term = document.getElementById('search').value.toLowerCase();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            db.filter(i => i.title.toLowerCase().includes(term)).forEach(i => {
                grid.innerHTML += `
                    <div class="kb-card" onclick="openM(${i.id})">
                        <span class="menu-tag">${i.menu}</span>
                        <h3>${i.title} ${i.type === 'Arquivo' ? '📎' : ''}</h3>
                        ${role === 'admin' ? `<button onclick="event.stopPropagation(); deleteR(${i.id})">🗑️</button>` : ''}
                    </div>`;
            });
        }

        async function deleteR(id) { if(confirm('Excluir?')) { await supabaseClient.from('registros').delete().eq('id', id); carregarDados(); } }
        function openM(id) {
            const i = db.find(x => x.id === id);
            document.getElementById('m-title').innerText = i.title;
            document.getElementById('modal-body').innerHTML = i.type === 'Arquivo' ? `<a href="${i.content}" target="_blank" style="display:block; padding:20px; background:var(--carrefour-blue); color:white; text-align:center; text-decoration:none; border-radius:10px;">ABRIR DOCUMENTO PDF</a>` : `<div style="white-space:pre-wrap">${i.content}</div>`;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeM() { document.getElementById('modal').style.display = 'none'; }
        function logout() { sessionStorage.clear(); location.reload(); }
        function handleSearch() { render(); }
    </script>
</body>
</html>
